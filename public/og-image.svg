<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>

    <!-- Quadrant gradients -->
    <linearGradient id="q1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="q2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="q3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="q4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Matrix container -->
  <g transform="translate(100, 120)">
    <!-- Quadrant 1: Urgent & Important (top-left) -->
    <rect x="0" y="0" width="200" height="200" rx="12" fill="url(#q1)" stroke="#ef4444" stroke-width="2"/>
    <text x="100" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#ef4444" text-anchor="middle">URGENT &amp;</text>
    <text x="100" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#ef4444" text-anchor="middle">IMPORTANT</text>
    <text x="100" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#fca5a5" text-anchor="middle">Do First</text>

    <!-- Quadrant 2: Not Urgent & Important (top-right) -->
    <rect x="220" y="0" width="200" height="200" rx="12" fill="url(#q2)" stroke="#3b82f6" stroke-width="2"/>
    <text x="320" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#3b82f6" text-anchor="middle">NOT URGENT &amp;</text>
    <text x="320" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#3b82f6" text-anchor="middle">IMPORTANT</text>
    <text x="320" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#93c5fd" text-anchor="middle">Schedule</text>

    <!-- Quadrant 3: Urgent & Not Important (bottom-left) -->
    <rect x="0" y="220" width="200" height="200" rx="12" fill="url(#q3)" stroke="#f59e0b" stroke-width="2"/>
    <text x="100" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#f59e0b" text-anchor="middle">URGENT &amp;</text>
    <text x="100" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#f59e0b" text-anchor="middle">NOT IMPORTANT</text>
    <text x="100" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#fcd34d" text-anchor="middle">Delegate</text>

    <!-- Quadrant 4: Not Urgent & Not Important (bottom-right) -->
    <rect x="220" y="220" width="200" height="200" rx="12" fill="url(#q4)" stroke="#10b981" stroke-width="2"/>
    <text x="320" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#10b981" text-anchor="middle">NOT URGENT &amp;</text>
    <text x="320" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#10b981" text-anchor="middle">NOT IMPORTANT</text>
    <text x="320" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6ee7b7" text-anchor="middle">Eliminate</text>

    <!-- Axis labels -->
    <text x="-25" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="end" transform="rotate(-90, -25, 110)">IMPORTANT</text>
    <text x="210" y="-25" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">URGENT</text>
  </g>

  <!-- Title -->
  <text x="600" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="700" fill="#ffffff" text-anchor="middle">Quadrant Life</text>

  <!-- Subtitle -->
  <text x="600" y="490" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#94a3b8" text-anchor="middle">Intentional planning for a balanced, productive life</text>

  <!-- Feature highlights -->
  <g transform="translate(580, 530)">
    <circle cx="0" cy="0" r="4" fill="#3b82f6"/>
    <text x="15" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#cbd5e1">Multi-role planning</text>

    <circle cx="180" cy="0" r="4" fill="#10b981"/>
    <text x="195" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#cbd5e1">Goal alignment</text>

    <circle cx="340" cy="0" r="4" fill="#f59e0b"/>
    <text x="355" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#cbd5e1">Smart prioritization</text>
  </g>
</svg>